<!--==================== Carousel Desktop (md+) ====================-->
<div id="CarouselDesktopContainer" class="overflow-hidden d-none d-md-block" style="max-height: 650px;">
  <div id="CarouselDesktop" class="carousel slide h-100" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-inner h-100">

      <div class="carousel-item active h-100" data-bs-interval="3000">
        <img src="./images/desk/004-bannerdesk-soldigi.png"
             class="d-block w-100 h-100"
             width="1350" height="650"
             loading="eager" decoding="async" fetchpriority="high"
             alt="Banner Soluciones Digitales">
      </div>

      <div class="carousel-item h-100" data-bs-interval="3000">
        <img src="./images/desk/002-bannerdesk-gespro.png"
             class="d-block w-100 h-100"
             width="1350" height="650"
             loading="lazy" decoding="async"
             alt="Banner Gestión de Proyectos">
      </div>

      <div class="carousel-item h-100" data-bs-interval="3000">
        <img src="./images/desk/001-bannerdesk-desweb.png"
             class="d-block w-100 h-100"
             width="1350" height="650"
             loading="lazy" decoding="async"
             style="object-fit: cover; object-position: center;"
             alt="Banner Desarrollo Web">
      </div>

      <div class="carousel-item h-100" data-bs-interval="3000">
        <img src="./images/desk/005-bannerdesk-disind.png"
             class="d-block w-100 h-100"
             width="1350" height="650"
             loading="lazy" decoding="async"
             style="object-fit: cover; object-position: center;"
             alt="Banner Diseño Industrial">
      </div>

      <div class="carousel-item h-100" data-bs-interval="3000">
        <img src="./images/desk/006-bannerdesk-disgra.png"
             class="d-block w-100 h-100"
             width="1350" height="650"
             loading="lazy" decoding="async"
             style="object-fit: cover; object-position: center;"
             alt="Banner Diseño Gráfico">
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#CarouselDesktop" data-bs-slide="prev" aria-label="Anterior">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#CarouselDesktop" data-bs-slide="next" aria-label="Siguiente">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>
</div>
<!--==================== END Carousel Desktop ====================-->
