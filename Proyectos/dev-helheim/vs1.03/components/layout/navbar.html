<!--
    Modal de acceso frontend. La lógica de autenticación se incorporará en una
    etapa posterior, cuando se definan PHP 7.3+ y MySQL para el backend.
-->
<div class="modal fade helheim-login-modal" id="helheimLoginModal" tabindex="-1"
     aria-labelledby="helheimLoginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <p class="helheim-login-eyebrow mb-1">Acceso Helheim</p>
                    <h2 class="modal-title fs-5" id="helheimLoginModalLabel">Iniciar sesión</h2>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="helheimLoginIdentity" class="form-label">Usuario o correo</label>
                    <input type="text" class="form-control" id="helheimLoginIdentity"
                           name="identity" autocomplete="username"
                           placeholder="usuario@correo.cl">
                </div>

                <div class="mb-2">
                    <label for="helheimLoginCode" class="form-label">Código de acceso</label>
                    <input type="password" class="form-control" id="helheimLoginCode"
                           name="access_code" autocomplete="current-password"
                           placeholder="Ingresa tu código">
                </div>

                <p class="helheim-login-note mb-0" role="status">
                    Interfaz preparada. La autenticación se conectará cuando definamos la lógica de acceso.
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn helheim-login-submit" disabled
                        aria-disabled="true" title="Lógica de autenticación pendiente">
                    Ingresar
                </button>
            </div>
        </div>
    </div>
</div>
