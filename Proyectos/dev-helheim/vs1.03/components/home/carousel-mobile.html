<!--==================== Carousel Móvil ====================-->
<div id="CarouselMovil" class="carousel slide d-block d-md-none" data-bs-ride="carousel" data-bs-interval="3000">
  <div class="carousel-inner">

    <div class="carousel-item active" data-bs-interval="3000">
      <img src="./images/movil/004-bannermobile-soldigi.png"
           class="d-block w-100"
           width="1000" height="1200"
           loading="eager" decoding="async" fetchpriority="high"
           alt="Banner Soluciones Digitales">
    </div>

    <div class="carousel-item" data-bs-interval="3000">
      <img src="./images/movil/002-bannermobile-gespro.png"
           class="d-block w-100"
           width="1000" height="1200"
           loading="lazy" decoding="async"
           alt="Banner Gestión de Proyectos">
    </div>

    <div class="carousel-item" data-bs-interval="3000">
      <img src="./images/movil/001-bannermobile-desweb.png"
           class="d-block w-100"
           width="1000" height="1200"
           loading="lazy" decoding="async"
           alt="Banner Desarrollo Web">
    </div>

    <div class="carousel-item" data-bs-interval="3000">
      <img src="./images/movil/005-bannermobile-disind.png"
           class="d-block w-100"
           width="1000" height="1200"
           loading="lazy" decoding="async"
           alt="Banner Diseño Industrial">
    </div>

    <div class="carousel-item" data-bs-interval="3000">
      <img src="./images/movil/006-bannermobile-disgra.png"
           class="d-block w-100"
           width="1000" height="1200"
           loading="lazy" decoding="async"
           alt="Banner Diseño Gráfico">
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#CarouselMovil" data-bs-slide="prev" aria-label="Anterior">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#CarouselMovil" data-bs-slide="next" aria-label="Siguiente">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Siguiente</span>
  </button>
</div>
<!--==================== END Carousel Móvil ====================-->
