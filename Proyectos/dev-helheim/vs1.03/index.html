    <!-- Evita parpadeos: aplica preferencias persistidas antes de renderizar CSS. -->
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("helheim-theme");
          document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
          const lang = localStorage.getItem("helheim-language");
          if (["es", "en", "pt", "ja", "da", "eu", "is", "fr", "zh", "ru"].includes(lang)) document.documentElement.lang = lang;
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
